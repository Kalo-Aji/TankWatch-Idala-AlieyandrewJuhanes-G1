<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TankWatch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .site-navbar {
      background: #0b2d26;
      border-bottom: 3px solid #a8e6c8;
    }
    .site-navbar .navbar-brand {
      color: #a8e6c8;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .site-navbar .navbar-brand:hover,
    .site-navbar .navbar-text {
      color: #e8f7ef;
    }
    .site-navbar .btn-mint {
      background: #a8e6c8;
      border-color: #a8e6c8;
      color: #0b2d26;
      font-weight: 600;
    }
    .site-navbar .btn-mint:hover {
      background: #c1f0d7;
      border-color: #c1f0d7;
      color: #0b2d26;
    }
    .site-navbar .btn-outline-mint {
      border-color: #a8e6c8;
      color: #a8e6c8;
    }
    .site-navbar .btn-outline-mint:hover {
      background: #a8e6c8;
      color: #0b2d26;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
    <div class="container">
      <a class="navbar-brand" href="/">TankWatch</a>
      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
          <span class="navbar-text">Hi, {{ user.username }}!</span>
          <a class="btn btn-outline-mint btn-sm" href="{% url 'profile' %}">Profile</a>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button class="btn btn-mint btn-sm" type="submit">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-mint btn-sm" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-mint btn-sm" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
